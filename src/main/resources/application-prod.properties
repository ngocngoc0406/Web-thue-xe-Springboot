server.port=${PORT:8080}

# AI Configuration
ai.provider=${AI_PROVIDER:pollinations}
ai.model=${AI_MODEL:openai}
ai.api.key=${AI_API_KEY:}

#### SQL Server Configuration (Railway SQL Server Plugin hoặc external)
spring.datasource.url=${DATABASE_URL:jdbc:sqlserver://localhost:1433;database=CarRental;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:ngoc}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#### JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#### App Settings
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
spring.devtools.restart.log-condition-evaluation-delta=false

#### File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

#### Logging
logging.level.org.springframework.jdbc=INFO
logging.level.com.zaxxer.hikari=INFO
