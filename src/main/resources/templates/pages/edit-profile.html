<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<title>Web thuê xe - Trang cá nhân</title>
<link rel="icon" th:href="@{/images/icon-logo.png}" type="images/x-icon">

<head th:replace="~{pages/layout/header-css-js :: header-css-js}">
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<nav th:replace="~{pages/layout/header :: header}"></nav>
	<div class="container-fluid" style="padding: 0">
		<div class="img-head"></div>
		<div class="profile">
			<div class="profile-info">
				<div class="avatar">
					<img alt="" th:src="@{'/uploads/'+${user.image}}" class="avatar-img">
					<form action="/upload-avatar" enctype="multipart/form-data" method="post">
						<input type="file" accept=".png, .jpg, .jpeg, .git" name="avatar-user">
						<button>Lưu</button>
					</form>
				</div>
				<div class="name-info">
					<h2 th:text="${user.nameDisplay}"></h2>
					<a onclick="openPopup()"><i class="fa-solid fa-pen-to-square"></i></a>
					<p th:text="'Ngày tham gia '+${user.createDate}"></p>
					<h6 th:text="'Ngày sinh '+${user.dateOfBrith}"></h6>
					<h6 th:text="${user.sex} ? 'Giới tính : nam' : 'Giới tính : nữ'"></h6>
					<p th:text="${user.address}"></p>
				</div>
				<div class="popup" id="popup">
					<form action="/update-info-user" method="post" name="edit-infomation">
						<h4>Thông tin</h4>
						<h6>Tên hiển thị</h6>
						<input type="text" placeholder="Tên hiển thỉ" name="name-display" id="namedisplay" th:value="${user.nameDisplay}">
						<small></small>
						<h6>Ngày sinh</h6>
						<input type="text" placeholder="Ngày sinh" name="dateOfBrith" id="dateOfBrith" th:value="${user.dateOfBrith}"> <small></small>
						<h6>Giới tính</h6>
						<div class="group-form-address">
							<select id="sex" name="sex">
								<option value="0">Nam</option>
								<option value="1">Nữ</option>
							</select> <small></small>
						</div>
						<h6>Địa chỉ</h6>
						<div class="group-form-address">
							<select name="province" th:onchange="GetDistrict(this.value)" id="province">
								<option value="0">Chọn tỉnh - thành phố</option>
								<th:block th:each="item : ${province}">
									<option th:value="${item.idProvince}" th:text="${item.nameProvince}"></option>
								</th:block>
							</select> <small></small>
						</div>
						<div class="group-form-address">
							<select id="district" name="district" th:onchange="getWard(this.value)">
								<option value="0">Chọn quận - huyện</option>
							</select> <small></small>
						</div>
						<div class="group-form-address">
							<select name="ward" id="ward">
								<option value="0">Chọn phường /xã</option>
							</select> <small></small>
						</div>
						<h6>Địa chỉ cụ thể</h6>
						<div class="form-inline-address">
							<input type="text" placeholder=" Số nhà 12, ngõ 7, đường, khối" name="address-detail"
								id="address-detail"> <small></small>
						</div>
						<div class="group-action">
							<a class="btn-cancel" onclick="closePopup()">Hủy bỏ</a>
							<button class="btn-success" type="submit">Xác nhận</button>
						</div>
					</form>
				</div>
			</div>
			<div class="information-acc">
				<ul>
					<li><span class="title-text">Số điện thoại</span> <span class="content-text">
							<a onclick="openPopupPhone()"><i class="fa-solid fa-pen-to-square"></i></a>
							<span th:text="${user.phone}"></span>
						</span>
						<div class="popup" id="popup-phone">
							<form action="/updatePhone" id="" method="post" name="edit-phone">
								<h4>Thông tin</h4>
								<h6>Số điện thoại</h6>
								<input type="text" placeholder="Số điện thoại" name="phone" id="phone" th:value="${user.phone}"> <small></small>
								<div class="group-action">
									<a class="btn-cancel" onclick="closePopupPhone()">Hủy bỏ</a>
									<button class="btn-success" type="submit">Xác nhận</button>
								</div>
							</form>
						</div>
					</li>
					<li><span class="title-text">Giấy phép lái xe</span> <span class="content-text">
							<a onclick="openPopupGPLX()"><i class="fa-solid fa-pen-to-square"></i></a>
							<span th:text="${user.drivingLicense}"></span>
							<img alt="" th:src="'/uploads/'+${user.ImgDrivingLicense}" class="gplx-img">
						</span>
						<div class="popup" id="popup-gplx">
							<form action="/upload-gplx" method="post" id="" enctype="multipart/form-data"
								name="edit-gplx">
								<h4>Thông tin</h4>
								<h6>Số giấy phép lái xe</h6>
								<input type="text" placeholder="Số nằm mắt trước của GPLX" name="gplx" id="gplx" th:value="${user.drivingLicense}">
								<small></small>
								<h6>Tải ảnh</h6>
								<input type="file" name="image-gplx" accept=".jpg, .png, .git" id="image-gplx">
								<small></small>
								<div class="group-action">
									<a class="btn-cancel" onclick="closePopupGPLX()">Hủy bỏ</a>
									<button class="btn-success" type="submit">Xác nhận</button>
								</div>
							</form>
						</div>
					</li>
					<li><span class="title-text">Email</span> <span class="content-text">
							<a onclick="openPopupEmail()"><i class="fa-solid fa-pen-to-square"></i></a>
							<span th:text="${user.email}"></span>
						</span>
						<div class="popup" id="popup-email">
							<form action="/updateEmail" method="post" id="" name="edit-email">
								<h4>Thông tin</h4>
								<h6>Email</h6>
								<input type="text" placeholder="Email" name="email" id="email" th:value="${user.email}"> <small></small>
								<div class="group-action">
									<a class="btn-cancel" onclick="closePopupEmail()">Hủy bỏ</a>
									<button class="btn-success" type="submit">Xác nhận</button>
								</div>
							</form>
						</div>
					</li>
				</ul>
			</div>
		</div>
	</div>
</body>

<style>
	/* Page Background */
	body {
		background: #f0f2f0;
	}

	/* Header Image */
	.img-head {
		height: 200px;
		background: linear-gradient(135deg, #1a472a, #2d5a3d);
	}

	/* Profile Section */
	.profile {
		background: #f0f2f0;
		padding: 0 40px 40px;
	}

	.profile-info {
		display: flex;
		justify-content: center;
		gap: 30px;
		margin-top: -50px;
		position: relative;
	}

	/* Avatar */
	.avatar {
		background: white;
		padding: 20px;
		border-radius: 16px;
		box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
		text-align: center;
	}

	.avatar-img {
		width: 100px;
		height: 100px;
		border-radius: 50%;
		object-fit: cover;
		border: 3px solid #2d5a3d;
	}

	.avatar form {
		margin-top: 15px;
	}

	.avatar input[type="file"] {
		font-size: 12px;
		margin-bottom: 10px;
	}

	.avatar button {
		background: #2d5a3d;
		color: white;
		border: none;
		padding: 8px 25px;
		border-radius: 20px;
		cursor: pointer;
		font-weight: 600;
	}

	.avatar button:hover {
		background: #1a472a;
	}

	/* Name Info */
	.name-info {
		background: white;
		padding: 25px 40px;
		border-radius: 16px;
		box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
		min-width: 400px;
		position: relative;
	}

	.name-info h2 {
		color: #1a472a;
		margin: 0 0 10px;
		font-size: 1.5rem;
	}

	.name-info p,
	.name-info h6 {
		color: #666;
		margin: 5px 0;
		font-weight: normal;
	}

	.name-info>a {
		position: absolute;
		top: 20px;
		right: 20px;
		background: #2d5a3d;
		color: white;
		width: 36px;
		height: 36px;
		border-radius: 50%;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
	}

	.name-info>a:hover {
		background: #1a472a;
	}

	/* Information Section */
	.information-acc {
		background: white;
		border-radius: 16px;
		padding: 25px 40px;
		margin-top: 25px;
		box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
	}

	.information-acc ul {
		display: flex;
		gap: 30px;
		list-style: none;
		padding: 0;
		margin: 0;
	}

	.information-acc li {
		flex: 1;
		background: #f8faf8;
		padding: 20px;
		border-radius: 12px;
		border-left: 4px solid #2d5a3d;
		position: relative;
	}

	.information-acc .title-text {
		display: block;
		color: #888;
		font-size: 13px;
		margin-bottom: 8px;
		font-weight: 600;
	}

	.information-acc .content-text {
		display: block;
		position: static;
		transform: none;
		margin: 0;
	}

	.information-acc .content-text span {
		color: #1a472a;
		font-weight: 600;
		font-size: 15px;
	}

	.information-acc .content-text a {
		position: absolute;
		top: 15px;
		right: 15px;
		color: #2d5a3d;
		cursor: pointer;
	}

	.information-acc .content-text a:hover {
		color: #1a472a;
	}

	.gplx-img {
		width: 100px !important;
		height: auto !important;
		position: static !important;
		display: block;
		margin-top: 10px;
		border-radius: 8px;
	}

	/* Popup */
	.popup {
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%) scale(0);
		width: 90%;
		max-width: 450px;
		background: white;
		border-radius: 16px;
		padding: 30px;
		box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
		z-index: 9999;
		visibility: hidden;
		transition: all 0.3s;
	}

	.open-popup {
		visibility: visible;
		transform: translate(-50%, -50%) scale(1);
	}

	.popup h4 {
		text-align: center;
		color: #1a472a;
		margin: 0 0 20px;
		font-size: 1.3rem;
	}

	.popup h6 {
		color: #333;
		margin: 15px 0 5px;
		font-size: 14px;
	}

	.popup input,
	.popup select {
		width: 100%;
		padding: 12px 15px;
		border: 2px solid #e0e0e0;
		border-radius: 10px;
		font-size: 14px;
		margin: 0;
	}

	.popup input:focus,
	.popup select:focus {
		border-color: #2d5a3d;
		outline: none;
	}

	.popup small {
		color: red;
		font-size: 12px;
		display: block;
		margin-top: 3px;
	}

	.popup .group-action {
		display: flex;
		gap: 15px;
		margin-top: 25px;
	}

	.popup .group-action a,
	.popup .group-action button {
		flex: 1;
		padding: 12px;
		border-radius: 10px;
		font-weight: 600;
		font-size: 15px;
		text-align: center;
		cursor: pointer;
		border: none;
		text-decoration: none;
	}

	.popup .btn-cancel {
		background: #f0f0f0;
		color: #666;
	}

	.popup .btn-cancel:hover {
		background: #e0e0e0;
	}

	.popup .btn-success {
		background: #2d5a3d;
		color: white;
	}

	.popup .btn-success:hover {
		background: #1a472a;
	}

	/* Responsive */
	@media (max-width: 768px) {
		.profile-info {
			flex-direction: column;
			align-items: center;
			padding: 0 20px;
		}

		.name-info {
			min-width: auto;
			width: 100%;
		}

		.information-acc ul {
			flex-direction: column;
		}
	}
</style>

<footer th:replace="~{pages/layout/footer :: footer}"></footer>

<script th:src="@{/js/main.js}"></script>
<script>
	var popup = document.getElementById('popup');
	function openPopup() {
		popup.classList.add("open-popup");
	}
	function closePopup() {
		popup.classList.remove("open-popup");
	}

	var popup_phone = document.getElementById('popup-phone');
	function openPopupPhone() {
		popup_phone.classList.add("open-popup");
	}
	function closePopupPhone() {
		popup_phone.classList.remove("open-popup");
	}

	var popup_email = document.getElementById('popup-email');
	function openPopupEmail() {
		popup_email.classList.add("open-popup");
	}
	function closePopupEmail() {
		popup_email.classList.remove("open-popup");
	}

	var popup_gplx = document.getElementById('popup-gplx');
	function openPopupGPLX() {
		popup_gplx.classList.add("open-popup");
	}
	function closePopupGPLX() {
		popup_gplx.classList.remove("open-popup");
	}
</script>

<th:block th:if="${messege_error}">
	<script>
		alert("Cần cập nhật số điện thoại, bằng lái");
	</script>
</th:block>

</html>
