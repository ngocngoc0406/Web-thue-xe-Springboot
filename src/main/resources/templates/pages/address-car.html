<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<title>Web thuê xe- Xe theo tỉnh</title>
<link rel="icon" th:href="@{/images/icon-logo.png}" type="images/x-icon">

<head th:replace="~{pages/layout/header-css-js :: header-css-js}">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav th:replace="~{pages/layout/header :: header}"></nav>
    <div class="col-md-12" style="padding: 0px;">
        <div th:replace="~{pages/layout/search-car ::search-car}"></div>
    </div>

    <div class="container premium-location-page" style="padding: 0px 15px;">
        <div class="row">
            <!-- Section: Discounted Cars -->
            <div class="section-premium">
                <h4 class="title-premium-main" th:text="'SIÊU ƯU ĐÃI TẠI ' + ${address}"></h4>
                <div id="carouselCarNotDriver" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner premium-carousel-inner">
                        <div class="carousel-item-premium" th:each="c: ${carPromotinalPrice}">
                            <div class="premium-car-card-listing">
                                <a th:href="@{'/car-detail/'+ ${c.idCar}+'/'+${c.nameCar}}" class="no-underline">
                                    <div class="card-img-wrap">
                                        <img th:src="@{'/uploads/'+${c.avatarCar}}" alt="...">
                                        <div class="premium-badge-float">
                                            <span th:text="'-'+ ${c.promotionalPrice} +'%'"></span>
                                        </div>
                                    </div>
                                    <div class="card-content-premium">
                                        <h5 class="car-name-listing" th:text="${c.nameCar}"> </h5>
                                        <div class="car-meta-listing">
                                            <span class="trip-count"><i class="fa fa-route"></i> SỐ chuyến</span>
                                            <span class="car-loc"><i class="fa fa-location-dot"></i> <span
                                                    th:text="${c.addressCar}"></span></span>
                                        </div>
                                        <div class="card-listing-footer">
                                            <div class="price-box-premium">
                                                <span class="final-price"
                                                    th:text="${#numbers.formatDecimal(c.price - (c.price * c.promotionalPrice / 100), 0, 'COMMA', 0, 'POINT')} + ' K'"></span>
                                                <span class="price-unit">/ngày</span>
                                            </div>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section: Featured Cars -->
            <div class="section-premium mt-5">
                <h4 class="title-premium-main" th:text="'KHÁM PHÁ XE NỔI BẬT ' + ${address}"></h4>
                <div id="carouselCarDriver" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner premium-carousel-inner">
                        <div class="carousel-item-premium" th:each="c: ${listCar}">
                            <div class="premium-car-card-listing">
                                <a th:href="@{'/car-detail/'+ ${c.idCar}+'/'+${c.nameCar}}" class="no-underline">
                                    <div class="card-img-wrap">
                                        <img th:src="@{'/uploads/'+${c.avatarCar}}" alt="...">
                                    </div>
                                    <div class="card-content-premium">
                                        <h5 class="car-name-listing" th:text="${c.nameCar}"> </h5>
                                        <div class="car-meta-listing">
                                            <span class="trip-count"><i class="fa fa-route"></i> SỐ chuyến</span>
                                            <span class="car-loc"><i class="fa fa-location-dot"></i> <span
                                                    th:text="${c.addressCar}"></span></span>
                                        </div>
                                        <div class="card-listing-footer">
                                            <div class="price-box-premium">
                                                <span class="final-price"
                                                    th:text="${#numbers.formatDecimal(c.price - (c.price * (c.promotionalPrice ?: 0) / 100), 0, 'COMMA', 0, 'POINT')} + ' K'"></span>
                                                <span class="price-unit">/ngày</span>
                                            </div>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section: Reviews -->
            <div class="section-premium mt-5">
                <h3 class="title-premium-main" th:text="'NHẬN XÉT TỪ KHÁCH HÀNG TẠI ' + ${address}"> </h3>
                <div class="premium-reviews-grid">
                    <div class="premium-review-card shadow-sm" th:each="i : ${#numbers.sequence(1, 3)}">
                        <div class="review-avatar">
                            <img th:src="@{/images/avatar1.jpg}" alt="">
                        </div>
                        <div class="review-body">
                            <div class="review-header">
                                <span class="reviewer-name">Hoàng Nguyễn</span>
                                <span class="review-time">10 phút trước</span>
                            </div>
                            <div class="review-stars">
                                <i class="fa fa-star text-warning"></i>
                                <i class="fa fa-star text-warning"></i>
                                <i class="fa fa-star text-warning"></i>
                                <i class="fa fa-star text-warning"></i>
                                <i class="fa fa-star text-warning"></i>
                            </div>
                            <p class="review-text">Xe đi rất êm, chủ xe nhiệt tình hỗ trợ. Sẽ tiếp tục ủng hộ lần sau!
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section: Suggested Locations -->
            <div class="section-premium mt-5 mb-5">
                <h4 class="title-premium-main">CÁC ĐỊA ĐIỂM LIÊN QUAN</h4>
                <div class="premium-location-grid">
                    <a th:href="@{'/filter?address=' + ${d.nameDistrict}}" class="premium-location-tag"
                        th:each="d: ${distric}">
                        <i class="fa fa-map-pin mr-2"></i> <span th:text="${d.nameDistrict}"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <style>
        :root {
            --primary-emerald: #10b981;
            --deep-slate: #0f172a;
            --soft-slate: #1e293b;
            --listing-bg: #f8fafc;
            --emerald-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        body {
            font-family: 'Inter', sans-serif !important;
            background: var(--listing-bg);
            color: var(--deep-slate);
        }

        .premium-location-page {
            padding-top: 50px;
        }

        .title-premium-main {
            font-weight: 800;
            color: var(--deep-slate);
            font-size: 1.25rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
            position: relative;
            padding-left: 15px;
            border-left: 5px solid var(--primary-emerald);
        }

        /* Carousel Reset to Grid for better Premium look */
        .premium-carousel-inner {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            overflow: visible !important;
        }

        .premium-car-card-listing {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
        }

        .premium-car-card-listing:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--primary-emerald);
        }

        .card-img-wrap {
            position: relative;
            height: 180px;
            overflow: hidden;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .premium-car-card-listing:hover .card-img-wrap img {
            transform: scale(1.08);
        }

        .premium-badge-float {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ef4444;
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }

        .card-content-premium {
            padding: 20px;
        }

        .car-name-listing {
            font-weight: 800;
            color: #0f172a;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .car-meta-listing {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .car-meta-listing span {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .car-meta-listing i {
            color: var(--primary-emerald);
            width: 16px;
        }

        .price-box-premium {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .final-price {
            font-size: 1.4rem;
            font-weight: 900;
            color: #1a472a;
        }

        .price-unit {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Reviews */
        .premium-reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .premium-review-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            gap: 20px;
            border: 1px solid #f1f5f9;
        }

        .review-avatar img {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            object-fit: cover;
        }

        .reviewer-name {
            font-weight: 700;
            font-size: 1rem;
            color: #1e293b;
        }

        .review-time {
            font-size: 11px;
            color: #94a3b8;
            margin-left: 10px;
        }

        .review-stars {
            margin: 8px 0;
            font-size: 12px;
        }

        .review-text {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.6;
            margin: 0;
        }

        /* Locations */
        .premium-location-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .premium-location-tag {
            background: white;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 24px;
            color: #475569;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .premium-location-tag:hover {
            border-color: var(--primary-emerald);
            color: var(--primary-emerald);
            background: #f0fdf4;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
        }

        .no-underline {
            text-decoration: none !important;
            color: inherit !important;
        }

        /* Temporary hiding carousel controls to maintain Grid look as requested while keeping structure */
        .carousel-control-prev,
        .carousel-control-next {
            display: none !important;
        }
    </style>
</body>
<footer th:replace="~{pages/layout/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

</html>
