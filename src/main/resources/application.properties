server.port=8080

# AI Configuration - Pollinations.ai (FREE)
ai.provider=pollinations
ai.model=openai
ai.api.key=

#### SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;database=CarRental;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=ngoc
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#### JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#### App Settings
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
spring.devtools.restart.log-condition-evaluation-delta=false

#### File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

#### Logging
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
